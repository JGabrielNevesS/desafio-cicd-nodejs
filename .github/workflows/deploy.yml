name: V1  Deploy Node.js Application to Azure VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rodar-testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Instalar dependências
        run: npm ci
        working-directory: app

      - name: Validar sintaxe do código
        run: node --check server.js
        working-directory: app

      - name: Executar aplicação
        run: |
          npm start &
          sleep 2
          curl --fail http://127.0.0.1:3000
        working-directory: app

  deploy:
    runs-on: ubuntu-latest
    needs: rodar-testes
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependências do Ansible
        run: |
          python -m pip install ansible-core==2.21.3
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Preparar acesso SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
            chmod 600 "$HOME/.ssh/deploy_key"
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 644 "$HOME/.ssh/known_hosts"

      - name: Criar inventário do Ansible
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
        run: |
          printf '[servers]\n%s ansible_user=%s\n' \
          "$SERVER_HOST" "$SERVER_USER" \
          > "$RUNNER_TEMP/inventory.ini"

      - name: Executar playbook do Ansible
        run: |
          ansible-playbook -i "$RUNNER_TEMP/inventory.ini" ansible/setup.yml --tags app --private-key "$HOME/.ssh/deploy_key" --extra-vars "app_version=$GITHUB_SHA"

      - name: Testar aplicação implantada
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
        run: |
          curl \
            --fail \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            "http://$SERVER_HOST/"
